<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>RoboSapiens 2026 — Estoura Balões</title>
  <link rel="icon" type="image/png" href="assets/robosapiens.png">
  <link rel="stylesheet" href="style.css?v=20260930q">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <img src="assets/robosapiens.png" class="logo robo" alt="RoboSapiens">
      <div class="brand-divider"></div>
      <img src="assets/ifsul.svg" class="logo ifsul" alt="IFSul Campus Sapiranga">
    </div>
    <div class="event-badge">
      <span>ROBOSAPIENS 2026</span>
      <strong>Robô Estoura Balão</strong>
    </div>
    <div class="top-actions">
      <button class="tv-pill" id="tvPill" title="O que o público vê no telão — clique para configurar"></button>
      <button class="net-pill hidden" id="netPill" title="Telão em outro PC"></button>
      <button class="icon-btn" id="btnFullscreen" title="Tela cheia" aria-label="Tela cheia">⛶</button>
      <button class="icon-btn" id="btnTelao" title="Abrir telão em nova janela" aria-label="Abrir telão em nova janela">📺</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <nav aria-label="Menu principal">
        <button class="nav-btn active" data-view="inicio" title="Início" aria-label="Início"><i aria-hidden="true">🏠</i> <span>Início</span></button>
        <button class="nav-btn" data-view="crono" title="Cronograma" aria-label="Cronograma"><i aria-hidden="true">🗓️</i> <span>Cronograma</span></button>
        <button class="nav-btn" data-view="equipes" title="Equipes" aria-label="Equipes"><i aria-hidden="true">👥</i> <span>Equipes</span></button>
        <button class="nav-btn" data-view="cores" title="Cores" aria-label="Cores"><i aria-hidden="true">🎨</i> <span>Cores</span></button>
        <button class="nav-btn nav-arena" data-view="arena" title="Arena Livre" aria-label="Arena Livre"><i aria-hidden="true">🎈</i> <span>Arena Livre</span></button>
        <button class="nav-btn nav-cup" data-view="confrontos" title="Confronto Direto" aria-label="Confronto Direto"><i aria-hidden="true">⚔️</i> <span>Confronto Direto</span></button>
        <button class="nav-btn nav-geral" data-view="geral" title="Classificação Geral" aria-label="Classificação Geral"><i aria-hidden="true">🏆</i> <span>Classificação Geral</span></button>
        <button class="nav-btn" data-view="telao" title="Telão" aria-label="Telão"><i aria-hidden="true">📺</i> <span>Telão</span></button>
        <button class="nav-btn" data-view="config" title="Configurações" aria-label="Configurações"><i aria-hidden="true">⚙️</i> <span>Config.</span></button>
      </nav>
      <div class="sidebar-foot">RoboSapiens · IFSul<br>Campus Sapiranga</div>
    </aside>

    <main id="main" class="main"><div class="loading" role="status">Carregando…</div></main>
  </div>
</div>

<div id="tvFull" class="tv-full hidden"></div>

<div id="modal" class="modal hidden">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div id="modalContent"></div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<script src="assets/logo-sumula.js?v=20260930q"></script>
<script src="script.js?v=20260930q"></script>
</body>
</html>
